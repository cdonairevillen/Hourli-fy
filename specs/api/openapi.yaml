openapi: 3.1.0
info:
  title: Registro de horas
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - health
      summary: Health
      description: Comprueba que la API responde (lo usan el frontend y Cloud Run).
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api Health Get
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Crea una cuenta con cualquier email (sin confirmación) y deja la
        sesión abierta.
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: Entrar con email y contraseña. Máximo 10 intentos cada 15 min por
        IP y email.
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/password/forgot:
    post:
      tags:
      - auth
      summary: Forgot Password
      description: Manda un link para elegir contraseña nueva. Responde lo mismo exista
        o no la cuenta.
      operationId: forgot_password_api_auth_password_forgot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordBody'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Forgot Password Api Auth Password Forgot Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/password/reset:
    post:
      tags:
      - auth
      summary: Reset With Token
      description: Contraseña nueva con el link del email; además abre la sesión.
      operationId: reset_with_token_api_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/password:
    post:
      tags:
      - auth
      summary: Set Password
      description: Cambiar mi contraseña, o ponerme una si mi cuenta es solo de Google.
      operationId: set_password_api_auth_password_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordBody'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/google:
    post:
      tags:
      - auth
      summary: Login With Google
      description: Recibe el ID token de Google, crea o une la cuenta y pone la cookie.
      operationId: login_with_google_api_auth_google_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLogin'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      description: Borra la cookie de sesión.
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Me
      description: Usuario de la sesión actual (401 si no hay).
      operationId: me_api_auth_me_get
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - auth
      summary: Delete Me
      description: 'Eliminar mi cuenta: anonimiza mis datos y cierra la sesión (ver
        services/account.py).'
      operationId: delete_me_api_auth_me_delete
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces:
    get:
      tags:
      - workspaces
      summary: List My Workspaces
      description: Espacios en los que soy miembro activo (propios e invitados, archivados
        incluidos).
      operationId: list_my_workspaces_api_workspaces_get
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceRead'
                title: Response List My Workspaces Api Workspaces Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - workspaces
      summary: Create Workspace
      description: Crea un espacio del que soy dueño (y miembro). Máximo 5 propios
        sin archivar.
      operationId: create_workspace_api_workspaces_post
      parameters:
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}:
    patch:
      tags:
      - workspaces
      summary: Update Workspace
      description: Renombrar, archivar/desarchivar o transferir la propiedad a otro
        miembro activo.
      operationId: update_workspace_api_workspaces__wid__patch
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - workspaces
      summary: Delete Workspace
      description: 'Borra el espacio de verdad, con todo lo suyo, solo si no tiene
        ninguna tarea registrada.


        Con horas no se borra (son datos de otras personas): se archiva.'
      operationId: delete_workspace_api_workspaces__wid__delete
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/members:
    get:
      tags:
      - workspaces
      summary: List Members
      description: Miembros activos del espacio, el dueño primero.
      operationId: list_members_api_workspaces__wid__members_get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRead'
                title: Response List Members Api Workspaces  Wid  Members Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/members/{uid}/access:
    put:
      tags:
      - workspaces
      summary: Update Member Access
      description: 'El dueño decide qué ve un miembro: todos los proyectos o solo
        los de la lista.'
      operationId: update_member_access_api_workspaces__wid__members__uid__access_put
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Uid
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAccessUpdate'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/members/{uid}:
    delete:
      tags:
      - workspaces
      summary: Remove Member
      description: 'Salir del espacio (uid = yo) o expulsar a alguien (solo el dueño).


        No se borra la fila: se marca `removed_at` para que sus horas sigan en los
        informes.'
      operationId: remove_member_api_workspaces__wid__members__uid__delete
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Uid
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/invitations:
    get:
      tags:
      - workspaces
      summary: List Invitations
      description: Links del espacio, los más recientes primero (también caducados
        y revocados).
      operationId: list_invitations_api_workspaces__wid__invitations_get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationRead'
                title: Response List Invitations Api Workspaces  Wid  Invitations
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - workspaces
      summary: Create Invitation
      description: 'Crea un link que caduca a los 10 días, al espacio entero o solo
        a un proyecto.


        El token solo se ve en esta respuesta.'
      operationId: create_invitation_api_workspaces__wid__invitations_post
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/invitations/{invitation_id}:
    delete:
      tags:
      - workspaces
      summary: Revoke Invitation
      description: 'Revoca un link: deja de servir aunque no haya caducado.'
      operationId: revoke_invitation_api_workspaces__wid__invitations__invitation_id__delete
      parameters:
      - name: invitation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Invitation Id
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/invitations/{token}:
    get:
      tags:
      - invitations
      summary: Preview Invitation
      description: 'A qué espacio (y proyecto) invita el link y si sigue valiendo.
        Público: se ve antes de

        iniciar sesión.'
      operationId: preview_invitation_api_invitations__token__get
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/invitations/{token}/accept:
    post:
      tags:
      - invitations
      summary: Accept Invitation
      description: "Une al usuario al espacio con el alcance del link.\n\n- Link al\
        \ espacio: ve todos los proyectos (también si antes solo veía alguno).\n-\
        \ Link a un proyecto: si no era miembro, entra viendo solo ese proyecto; si\
        \ ya era miembro\n  limitado, se le suma ese proyecto.\nSi el link no le da\
        \ nada nuevo (ya lo veía), no gasta un uso."
      operationId: accept_invitation_api_invitations__token__accept_post
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          title: Token
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/projects:
    get:
      tags:
      - catalog
      summary: List Projects
      description: 'Proyectos del espacio que puedo ver (todos, o solo aquellos a
        los que me invitaron).


        Por defecto solo los activos (los que salen en la app).'
      operationId: list_projects_api_workspaces__wid__projects_get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectRead'
                title: Response List Projects Api Workspaces  Wid  Projects Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catalog
      summary: Create Project
      operationId: create_project_api_workspaces__wid__projects_post
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/projects/{project_id}:
    patch:
      tags:
      - catalog
      summary: Update Project
      description: Renombrar, cambiar color o archivar/desarchivar.
      operationId: update_project_api_workspaces__wid__projects__project_id__patch
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - catalog
      summary: Delete Project
      description: Borra el proyecto de verdad solo si no tiene ninguna tarea; si
        tiene, hay que archivarlo.
      operationId: delete_project_api_workspaces__wid__projects__project_id__delete
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/categories:
    get:
      tags:
      - catalog
      summary: List Categories
      description: Labels del espacio, cada una con sus sublabels. Por defecto solo
        las activas.
      operationId: list_categories_api_workspaces__wid__categories_get
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryRead'
                title: Response List Categories Api Workspaces  Wid  Categories Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catalog
      summary: Create Category
      operationId: create_category_api_workspaces__wid__categories_post
      parameters:
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workspaces/{wid}/categories/{category_id}:
    patch:
      tags:
      - catalog
      summary: Update Category
      description: 'Renombrar o archivar/desarchivar. Archivarla no toca sus sublabels:
        al no salir la

        label en los desplegables, sus sublabels tampoco.'
      operationId: update_category_api_workspaces__wid__categories__category_id__patch
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Category Id
      - name: wid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Wid
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:

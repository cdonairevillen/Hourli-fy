# Postgres local para desarrollo. En producción la BD es Supabase.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clockify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clockify}
      POSTGRES_DB: ${POSTGRES_DB:-clockify}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
